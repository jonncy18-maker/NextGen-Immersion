<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Luna tagging check (temporary)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 920px; margin: 24px auto; padding: 0 16px; color: #162040; }
  h1 { font-size: 1.3rem; }
  button { font: inherit; padding: 8px 16px; cursor: pointer; }
  #status { margin: 12px 0; color: #555; }
  .verdict { padding: 12px 16px; border-radius: 6px; margin: 12px 0; font-weight: 600; }
  .pass { background: #dff3e4; } .fail { background: #fbe3df; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #ddd; vertical-align: top; }
  .off { background: #fff4d6; } .bad { background: #fbe3df; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>Luna tagging check <small>(temporary, read-only)</small></h1>
<p>Sign in to the app on this same site first. This tags about 100 existing videos plus your admin-overridden ones with Luna and compares them to the stored labels. It writes nothing.</p>
<button id="run" type="button">Run the check</button>
<div id="status"></div>
<div id="out"></div>
<script>
var LEVELS = ['a1', 'a2', 'b1', 'b2', 'c1', 'c2'];
var statusEl = document.getElementById('status');
var out = document.getElementById('out');
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function dist(r) { return Math.abs(LEVELS.indexOf(r.luna_level) - LEVELS.indexOf(r.stored_level)); }

async function token() {
  var res = await fetch('/api/auth/token', { credentials: 'include', headers: { accept: 'application/json' } });
  var data = res.ok ? await res.json().catch(function () { return null; }) : null;
  if (!data || !data.token) throw new Error('Not signed in. Open the app on this site, sign in as admin, then come back.');
  return data.token;
}
async function call(query) {
  var res = await fetch('/api/luna-tag-eval?' + query, { headers: { authorization: 'Bearer ' + (await token()) } });
  var body = await res.json().catch(function () { return {}; });
  if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
  return body.rows;
}

document.getElementById('run').onclick = async function () {
  var btn = this; btn.disabled = true; out.innerHTML = '';
  try {
    statusEl.textContent = 'Checking your admin-overridden videos…';
    var admin = await call('part=admin');
    var sample = [];
    for (var off = 0; off < 102; off += 34) {
      statusEl.textContent = 'Tagging the sample… ' + sample.length + ' of about 100 done';
      sample = sample.concat(await call('part=sample&limit=34&offset=' + off));
    }
    var scored = sample.filter(function (r) { return !r.error; });
    var errors = sample.length - scored.length;
    var within1 = scored.filter(function (r) { return dist(r) <= 1; }).length;
    var exact = scored.filter(function (r) { return dist(r) === 0; }).length;
    var n = sample.length;
    var adminMatch = admin.filter(function (r) { return !r.error && r.luna_level === r.stored_level; }).length;
    var p1 = n ? within1 / n : 0, pe = n ? exact / n : 0;
    var pass = n >= 90 && p1 >= 0.9 && pe >= 0.7 && admin.length > 0 && adminMatch >= 5;
    out.innerHTML =
      '<div class="verdict ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'FAIL') +
      ' — within one level: ' + Math.round(p1 * 100) + '% (need 90%) · exact: ' + Math.round(pe * 100) +
      '% (need 70%) · admin overrides matched: ' + adminMatch + ' of ' + admin.length + ' (need 5 of 6) · errors: ' + errors + ' of ' + n + '</div>' +
      '<p>Topic (informational): ' + Math.round(100 * scored.filter(function (r) { return r.luna_topic === r.stored_topic; }).length / Math.max(scored.length, 1)) + '% same primary topic.</p>' +
      '<div class="wrap"><table><tr><th>Source</th><th>Title</th><th>Stored</th><th>Luna</th><th>Note</th></tr>' +
      admin.concat(sample).map(function (r) {
        var cls = r.error ? 'bad' : (r.luna_level !== r.stored_level ? 'off' : '');
        var note = r.error ? esc(r.error) : (r.luna_level === r.stored_level ? '' : (dist(r) + ' level' + (dist(r) > 1 ? 's' : '') + ' apart'));
        return '<tr class="' + cls + '"><td>' + esc(r.source) + '</td><td>' + esc(r.title) + '</td><td>' + esc((r.stored_level || '').toUpperCase()) + '</td><td>' + esc((r.luna_level || '').toUpperCase()) + '</td><td>' + note + '</td></tr>';
      }).join('') + '</table></div>';
    statusEl.textContent = 'Done.';
  } catch (e) {
    statusEl.textContent = 'Stopped: ' + e.message;
  }
  btn.disabled = false;
};
</script>
</body>
</html>
